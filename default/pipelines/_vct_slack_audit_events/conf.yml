output: default
streamtags:
  - vct
  - slack
  - audit
  - rest
groups: {}
functions:
  - id: comment
    filter: "true"
    conf:
      comment:
        This pipeline processes Slack audit log events by parsing the raw JSON
        data into individual fields, dropping events already seen by `id`,
        enriching the events with standard metadata fields such as index,
        sourcetype, source, and host, and then re-serializing the JSON data.
        Overall, it transforms raw Slack audit logs into structured,
        metadata-enriched events suitable for further analysis or storage.
  - id: eval
    filter: "true"
    disabled: null
    conf:
      add:
        - disabled: false
          name: _raw
          value: JSON.parse(_raw)
    description: Parse _raw JSON into individual fields
  - id: suppress
    filter: _raw != null && _raw.id != null
    disabled: false
    conf:
      keyExpr: _raw.id
      allow: 1
      suppressPeriodSec: 3600
      dropEventsMode: true
      maxCacheSize: 50000
      cacheIdleTimeoutPeriods: 2
      numEventsIdleTimeoutTrigger: 10000
    description:
      Allow one event per audit log `id` per hour. The collection window
      overlaps deliberately, so each event is normally retrieved more than
      once. This is a best-effort reducer bounded by the cache size and held
      per Worker Process - `id` remains the idempotency key for downstream
      deduplication.
  - id: eval
    filter: C.vars.enable_splunk_fields
    disabled: null
    conf:
      add:
        - disabled: false
          name: index
          value: C.vars.slack_audit_log_index
        - disabled: false
          name: sourcetype
          value: C.vars.datatype
        - disabled: false
          name: source
          value: "'slack_audit_logs'"
        - disabled: false
          name: host
          value: _raw.context.location.domain
    description:
      Set variable 'enable_splunk_fields' to true to enable these fields.
      Set standard metadata fields to values expected by the Splunk add-on for
      Slack.
  - id: serialize
    filter: "true"
    disabled: null
    conf:
      type: json
      dstField: _raw
      fields:
        - "*"
      srcField: _raw
    description: Re-serialize the enriched JSON back into `_raw`
description: This pipeline processes Slack audit log events by parsing the raw
  JSON data into individual fields, dropping events already seen by `id`,
  enriching the events with standard metadata fields such as index, sourcetype,
  source, and host, and then re-serializing the JSON data. Overall, it
  transforms raw Slack audit logs into structured, metadata-enriched events
  suitable for further analysis or storage.
